  <!--
    针对 iOS 上部分浏览器（尤其是 Chrome for iOS 从主屏幕图标冷启动时）地址栏/工具栏收起
    动画没有及时完成、导致 position:fixed 元素按"收起前"的旧尺寸定位，出现底部大块空白的情况。
    做一次极小幅度的"假滚动"，可以强制浏览器立刻把地址栏收起动画走完并触发一次真实布局重算，
    这是一个存在多年的移动端兼容技巧，对本身不可滚动（overflow:hidden）的页面同样有效。
  -->
  <script>
    (function () {
      function nudge() {
        window.scrollTo(0, 1);
        requestAnimationFrame(function () {
          window.scrollTo(0, 0);
        });
      }
      window.addEventListener('load', nudge);
      window.addEventListener('pageshow', nudge);
    })();
  </script>
